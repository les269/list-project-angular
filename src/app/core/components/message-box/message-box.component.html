<mat-dialog-content class="dialog-content">
  {{ data.message }}
</mat-dialog-content>
<mat-dialog-actions class="dialog-actions">
  @if (!data.onlyOk) {
    <button type="button" class="dialog-button" (click)="no()">
      {{ 'g.no' | translate }}
    </button>
  }
  <button
    type="button"
    class="dialog-button dialog-button-primary"
    cdkFocusInitial
    (click)="ok()">
    {{ 'g.ok' | translate }}
  </button>
</mat-dialog-actions>
