<div class="d-flex align-items-center gap-2 flex-wrap">
  @for (item of selectedData(); track $index) {
    <mat-chip
      >{{ displayLabel(item) }}
      <button
        type="button"
        [disabled]="disabled()"
        matChipRemove
        (click)="removeChip(item)">
        <mat-icon>cancel</mat-icon>
      </button>
    </mat-chip>
  }
  @if (required() && requiredMsg().length > 0 && value().length === 0) {
    <div>
      {{ requiredMsg() }}
    </div>
  }

  <button
    type="button"
    class="btn btn-outline-primary d-flex"
    [disabled]="disabled()"
    (click)="openSelectTable()">
    <mat-icon class="material-icons-outlined">
      <span class="material-symbols-outlined">select_window_2</span>
    </mat-icon>
  </button>
</div>
