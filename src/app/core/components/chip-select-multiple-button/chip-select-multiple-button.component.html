<div class="selection-control">
  @for (item of selectedData(); track $index) {
    <mat-chip
      >{{ displayLabel(item) }}
      <button
        type="button"
        [disabled]="disabled()"
        [attr.aria-label]="('g.clear' | translate) + ' ' + displayLabel(item)"
        matChipRemove
        (click)="removeChip(item)">
        <mat-icon>cancel</mat-icon>
      </button>
    </mat-chip>
  }
  @if (required() && requiredMsg().length > 0 && value().length === 0) {
    <div class="required-message">
      {{ requiredMsg() }}
    </div>
  }

  <button
    type="button"
    class="selection-button"
    [disabled]="disabled()"
    (click)="openSelectTable()">
    {{ 'g.popupSelect' | translate }}
  </button>
</div>
