<div class="selection-control">
  @if (value()) {
    <mat-chip-row (removed)="removeChip()">
      {{ displayLabel() }}
      <button
        type="button"
        [disabled]="disabled()"
        matChipRemove
        [attr.aria-label]="('g.clear' | translate) + ' ' + displayLabel()">
        <mat-icon>cancel</mat-icon>
      </button>
    </mat-chip-row>
  }
  @if (required() && requiredMsg().length > 0 && value().length === 0) {
    <div class="required-message">
      {{ requiredMsg() }}
    </div>
  }

  <button
    type="button"
    class="selection-button"
    [disabled]="disabled()"
    (click)="openSelectTable()">
    {{ 'g.popupSelect' | translate }}
  </button>
</div>
