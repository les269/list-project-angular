<mat-form-field
  appearance="outline"
  style="width: 100%"
  subscriptSizing="dynamic">
  @if (label()) {
    <mat-label>{{ label() }}</mat-label>
  }
  <mat-chip-grid #chipGrid [disabled]="disabled()">
    <div class="d-flex align-items-center flex-wrap">
      @for (item of value(); track $index; let i = $index) {
        <mat-chip-row
          (removed)="removeChip(i)"
          [editable]="!disabled()"
          (edited)="editChip(i, $event.value)">
          <div
            [ngStyle]="{
              'background-color': getLuminance(item) < 0.5 ? '' : '#525252',
              color: item,
            }">
            {{ item }}
          </div>
          <button type="button" [disabled]="disabled()" matChipRemove>
            <mat-icon>cancel</mat-icon>
          </button>
        </mat-chip-row>
      }
      <input
        class="form-control form-control-color"
        style="max-width: 30px"
        type="color"
        [value]="pickerValue()"
        [matChipInputFor]="chipGrid"
        [matChipInputAddOnBlur]="true"
        (matChipInputTokenEnd)="addChip($event)" />
    </div>
  </mat-chip-grid>
</mat-form-field>
