<mat-form-field
  appearance="outline"
  style="width: 100%"
  subscriptSizing="dynamic">
  @if (label()) {
    <mat-label>{{ label() }}</mat-label>
  }
  <mat-chip-grid #chipGrid [disabled]="disabled()">
    @for (item of value(); track $index; let i = $index) {
      <mat-chip-row
        (removed)="removeChip(i)"
        [editable]="!disabled()"
        (edited)="editChip(i, $event.value)">
        {{ item }}
        <button type="button" [disabled]="disabled()" matChipRemove>
          <mat-icon>cancel</mat-icon>
        </button>
      </mat-chip-row>
    }
    <input
      type="text"
      [matChipInputFor]="chipGrid"
      [matChipInputAddOnBlur]="true"
      (matChipInputTokenEnd)="addChip($event)" />
  </mat-chip-grid>
</mat-form-field>
