<div class="card">
  <app-generic-table
    [fields]="fields()"
    [createRow]="createRow"
    [cols]="cols"
    [displayedColumns]="displayedColumns"
    [expandedTmpl]="expandedTmpl"></app-generic-table>
</div>
<ng-template #expandedTmpl let-element>
  <div class="d-flex flex-column mb-2">
    <mat-checkbox [formField]="element.convertToArray">
      {{ 'scrapy.convertToArray' | translate }}
    </mat-checkbox>
    <mat-checkbox [formField]="element.onlyOwn">
      {{ 'scrapy.onlyOwn' | translate }}
    </mat-checkbox>
    <div class="d-flex input-group">
      <input
        class="form-control"
        [matTooltip]="'scrapy.useAttr' | translate"
        [placeholder]="'scrapy.useAttr' | translate"
        [formField]="element.attr" />
    </div>

    <div class="d-flex input-group">
      <input
        class="form-control"
        [matTooltip]="'scrapy.replaceRegular' | translate"
        [placeholder]="'scrapy.replaceRegular' | translate"
        [formField]="element.replaceRegular" />
      <input
        class="form-control"
        [matTooltip]="'scrapy.replaceRegularTo' | translate"
        [placeholder]="'scrapy.replaceRegularTo' | translate"
        [formField]="element.replaceRegularTo" />
    </div>
    <div class="d-flex input-group">
      <input
        class="form-control"
        [matTooltip]="'scrapy.useSplitText' | translate"
        [placeholder]="'scrapy.useSplitText' | translate"
        [formField]="element.splitText" />
    </div>
    <div class="d-flex input-group">
      <input
        class="form-control"
        [matTooltip]="'scrapy.useReplaceString' | translate"
        [placeholder]="'scrapy.useReplaceString' | translate"
        [formField]="element.replaceString" />
    </div>
    <div class="mt-1 d-flex flex-wrap gap-3 align-items-center">
      <label class="form-text">{{
        'scrapy.replaceValueMap' | translate
      }}</label>
      @if (element.replaceValueMapName().value()) {
        <mat-chip
          >{{ element.replaceValueMapName().value() }}
          <button
            matChipRemove
            (click)="element.replaceValueMapName().value.set('')">
            <mat-icon>cancel</mat-icon>
          </button>
        </mat-chip>
      }
      <button
        class="btn btn-outline-primary d-flex"
        (click)="selectReplaceValueMap(element)">
        <mat-icon class="material-icons-outlined"
          ><span class="material-symbols-outlined">
            select_window_2
          </span></mat-icon
        >
      </button>
    </div>
  </div>
</ng-template>
