<div class="container my-3">
  <button
    type="button"
    mat-icon-button
    [attr.aria-label]="'spiderPagination.back' | translate"
    (click)="onBack()">
    <mat-icon>arrow_back</mat-icon>
  </button>
  @if (spiderPagination.isLoading()) {
    <p role="status">{{ 'spiderPagination.loading' | translate }}</p>
  }
  @if (spiderPagination.error()) {
    <p class="text-danger" role="alert">
      {{ 'spiderPagination.loadFailed' | translate }}
    </p>
    <button
      type="button"
      class="btn btn-secondary"
      (click)="spiderPagination.reload()">
      {{ 'spiderPagination.reload' | translate }}
    </button>
  }
  <app-signal-field
    class="mb-2"
    [field]="form.spiderPaginationId"
    label="spiderPagination.spiderPaginationId" />
  <app-signal-field
    class="mb-2"
    [field]="form.paginationConfig.groupIdTemplate"
    label="spiderPagination.groupIdTemplate" />
  <p class="form-text">
    {{ 'spiderPagination.groupIdTemplateDesc' | translate }}
  </p>
  <app-signal-field
    class="mb-2"
    [field]="form.paginationConfig.dataIdKey"
    label="spiderPagination.dataIdKey" />
  <p class="form-text">{{ 'spiderPagination.dataIdKeyDesc' | translate }}</p>
  <app-signal-field
    class="mb-2"
    [field]="form.paginationConfig.startUrl"
    label="spiderPagination.startUrl" />
  <div class="d-flex gap-2 my-3">
    <button
      type="button"
      class="btn btn-primary"
      [disabled]="isCreateMode || form().disabled()"
      (click)="onHeadersDialog()">
      {{ 'spider.settingHeaders' | translate }}
    </button>
    <button
      type="button"
      class="btn btn-primary"
      [disabled]="isCreateMode || form().disabled()"
      (click)="onCookiesDialog()">
      {{ 'spider.settingCookies' | translate }}
    </button>
  </div>
  <app-signal-field
    class="mb-2"
    [field]="form.paginationConfig.nextPageUrlKey"
    label="spiderPagination.nextPageUrlKey" />
  <app-signal-field
    class="mb-2"
    [field]="form.paginationConfig.requestIntervalMs"
    label="spiderPagination.requestIntervalMs"
    [type]="fieldType.NUMBER" />

  <app-pagination-params [fields]="form.paginationConfig.paramSettings" />
  <app-pagination-update-control
    [fields]="form.paginationConfig.updateControl"
    [params]="form.paginationConfig.paramSettings" />
  <app-extraction-rules
    [fields]="form.paginationConfig.extractionRuleList"
    [mode]="form.paginationConfig.extractionRuleMode" />
  <button
    type="button"
    class="btn btn-success"
    [disabled]="form().disabled()"
    (click)="update()">
    {{ (isEditMode ? 'g.update' : 'g.save') | translate }}
  </button>
</div>
