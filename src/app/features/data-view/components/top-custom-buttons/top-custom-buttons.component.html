<div class="buttons">
  @for (custom of themeTopCustomList(); track $index) {
    @switch (custom.type) {
      @case ('openUrl') {
        <a
          class="custom-button"
          [href]="custom.openUrl"
          target="_blank"
          rel="noopener noreferrer">
          <span>{{ custom.label }}</span>
        </a>
      }
      @case ('writeNote') {
        <div class="custom-button-group">
          <button
            class="custom-button"
            (click)="openNoteDialog(custom, 'write')">
            <span>{{ custom.label }}</span>
          </button>
          @if (getCustomValue(custom) !== '') {
            <button
              class="custom-button custom-icon"
              (click)="openNoteDialog(custom, 'read')">
              <mat-icon class="material-icons-outlined">description</mat-icon>
            </button>
          }
        </div>
      }
      @case ('apiConfig') {
        <button
          class="custom-button"
          [disabled]="true"
          [title]="'apiRequestConfig.executionUnavailable' | translate">
          <span>{{ custom.label }}</span>
        </button>
      }
    }
  }
</div>
