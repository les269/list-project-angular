<div class="d-flex justify-content-between align-items-center">
  <h2 mat-dialog-title>
    {{ (disabledModel() ? 'g.read' : 'g.edit') | translate }}{{ data.title }}
  </h2>
  <button class="d-flex mx-2" mat-icon-button (click)="onNoClick()">
    <mat-icon>close</mat-icon>
  </button>
</div>
@if (disabledModel()) {
  <mat-dialog-content class="scrollbar-primary">
    <div cdkFocusInitial>
      <ngx-editor
        [ngClass]="{ disabled: disabledModel() }"
        [editor]="editor"
        [formField]="valueForm"></ngx-editor>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-button (click)="disabledModel.set(false)">
      {{ 'g.edit' | translate }}
    </button>
  </mat-dialog-actions>
} @else {
  <mat-dialog-content class="scrollbar-primary">
    <div>
      <ngx-editor-menu class="toolbar" [editor]="editor" [toolbar]="toolbar">
      </ngx-editor-menu>
      <ngx-editor [editor]="editor" [formField]="valueForm"></ngx-editor>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-button (click)="disabledModel.set(true)">
      {{ 'g.read' | translate }}
    </button>
    <button mat-button (click)="onNoClick()">
      {{ 'g.no' | translate }}
    </button>
    <button mat-button (click)="onSave()">
      {{ 'g.save' | translate }}
    </button>
    <button mat-button cdkFocusInitial (click)="onOK()">
      {{ 'g.ok' | translate }}
    </button>
  </mat-dialog-actions>
}
