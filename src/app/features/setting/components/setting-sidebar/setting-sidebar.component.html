<nav class="settings-links" [attr.aria-label]="'title.setting' | translate">
  @for (item of routes; track item.link) {
    <a
      class="settings-link"
      [routerLink]="item.link"
      routerLinkActive="settings-link-active"
      [routerLinkActiveOptions]="matchOptions"
      ariaCurrentWhenActive="page">
      {{ item.text | translate }}
    </a>
  }
</nav>
