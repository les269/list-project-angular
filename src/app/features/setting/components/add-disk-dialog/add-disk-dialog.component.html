<h2 mat-dialog-title class="dialog-title">
  {{ 'disk.addDisk' | translate }}
</h2>

<mat-dialog-content class="dialog-content">
  <div class="disk-field">
    <label class="field-label" for="add-disk-code">{{
      'disk.diskCode' | translate
    }}</label>
    <select
      #diskSelect
      id="add-disk-code"
      class="form-select"
      [value]="selectedDisk()"
      (change)="selectedDisk.set(diskSelect.value)">
      @for (option of diskOptions; track option) {
        <option [value]="option">
          {{ option }}
        </option>
      }
    </select>
  </div>
</mat-dialog-content>

<mat-dialog-actions class="dialog-actions">
  <button type="button" class="dialog-button" (click)="onCancel()">
    {{ 'g.cancel' | translate }}
  </button>
  <button
    type="button"
    class="dialog-button dialog-button-primary"
    (click)="onConfirm()">
    {{ 'g.confirm' | translate }}
  </button>
</mat-dialog-actions>
