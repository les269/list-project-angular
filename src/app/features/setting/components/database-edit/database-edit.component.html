<h2 mat-dialog-title class="dialog-title">
  {{ 'title.databaseEdit' | translate }}
</h2>
<mat-dialog-content class="dialog-content scrollbar-primary">
  <div class="editor-fields">
    <div class="field-row">
      <app-signal-field
        id="configId"
        [field]="form.configId"
        label="database.configId"
        hint="database.configIdPlaceholder"
        [trim]="true" />
      @if (hasError(form, 'configIdIsDefault') && form.configId().touched()) {
        <div class="field-error" role="alert">
          {{ 'database.configIdIsDefault' | translate }}
        </div>
      }
    </div>
    <app-signal-field
      id="configName"
      [field]="form.configName"
      label="database.configName"
      hint="database.configNamePlaceholder"
      [trim]="true" />
    <app-signal-field
      id="databaseType"
      [field]="form.databaseType"
      label="database.databaseType"
      [type]="fieldType.SELECT"
      [options]="databaseTypeOptions" />
    @if (isSqlite) {
      <app-signal-field
        id="sqliteFilePath"
        [field]="form.sqliteFilePath"
        label="database.sqliteFilePath"
        hint="database.sqliteFilePathPlaceholder"
        [trim]="true" />
    }
  </div>
  @if (isPostgresql) {
    <div class="editor-fields">
      <app-signal-field
        id="host"
        [field]="form.host"
        label="database.host"
        hint="database.hostPlaceholder"
        [trim]="true" />
      <app-signal-field
        id="port"
        [field]="form.port"
        label="database.port"
        hint="database.portPlaceholder"
        [type]="fieldType.NUMBER" />
      <app-signal-field
        id="databaseName"
        [field]="form.databaseName"
        label="database.databaseName"
        hint="database.databaseNamePlaceholder"
        [trim]="true" />
      <app-signal-field
        id="username"
        [field]="form.username"
        label="database.username"
        hint="database.usernamePlaceholder"
        [trim]="true" />
      <div class="field-row">
        <div class="editor-field">
          <label
            class="field-label"
            for="password"
            [class.require]="form.password().required()"
            >{{ 'database.password' | translate }}</label
          >
          <input
            id="password"
            class="form-control"
            type="password"
            [formField]="form.password"
            [placeholder]="'database.passwordPlaceholder' | translate"
            [class.is-invalid]="
              form.password().invalid() && form.password().touched()
            "
            [attr.aria-invalid]="
              form.password().invalid() && form.password().touched()
            "
            aria-describedby="database-password-errors" />
        </div>
        <app-form-invalids
          id="database-password-errors"
          [control]="form.password" />
      </div>
    </div>
  }
  <div class="editor-fields">
    <div class="editor-field description-field">
      <label class="field-label" for="description">{{
        'g.description' | translate
      }}</label>
      <textarea
        id="description"
        class="form-control"
        [formField]="form.description"
        [placeholder]="'database.descriptionPlaceholder' | translate"
        rows="2"></textarea>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions class="dialog-actions" [attr.aria-busy]="isProcessing()">
  <button
    type="button"
    class="dialog-button"
    [disabled]="isProcessing()"
    mat-dialog-close>
    {{ 'g.cancel' | translate }}
  </button>
  <button
    type="button"
    class="dialog-button"
    [disabled]="isProcessing()"
    (click)="testConnection()">
    {{ 'database.testConnection' | translate }}
  </button>
  <button
    type="button"
    class="dialog-button dialog-button-primary"
    [disabled]="isProcessing()"
    (click)="onSubmit()">
    {{ 'g.save' | translate }}
  </button>
</mat-dialog-actions>
