<section class="theme-section" aria-labelledby="theme-tag-title">
  <h2 class="section-title" id="theme-tag-title">
    {{ 'themeTag.title' | translate }}
  </h2>
  <div class="section-body">
    <app-theme-item-manage
      [headerId]="headerId()"
      [form]="form"
      [resetValue]="initialFormValue"
      [defaultBinding]="defaultBinding()">
    </app-theme-item-manage>
    <app-form-alerts
      [form]="fields"
      [formAlerts]="formAlerts()"></app-form-alerts>
    <app-generic-table
      appearance="outlined"
      [class.table-invalid]="fields().invalid()"
      [fields]="fields"
      [createRow]="createRow"
      [cols]="cols()"
      [displayedColumns]="displayedColumns">
    </app-generic-table>
  </div>
</section>
