<label class="h3">{{ 'themeTag.title' | translate }}</label>
<div class="card mb-3">
  <div class="card-body">
    <app-theme-item-manage
      [headerId]="headerId()"
      [form]="form"
      [resetValue]="initialFormValue"
      [defaultBinding]="defaultBinding()">
    </app-theme-item-manage>
    <app-form-alerts
      [form]="fields"
      [formAlerts]="formAlerts()"></app-form-alerts>
    <div class="card mb-3">
      <app-generic-table
        [class.table-invalid]="fields().invalid()"
        [fields]="fields"
        [createRow]="createRow"
        [cols]="cols()"
        [displayedColumns]="displayedColumns">
      </app-generic-table>
    </div>
  </div>
</div>
