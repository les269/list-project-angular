<section class="theme-section" aria-labelledby="theme-image-title">
  <h2 class="section-title" id="theme-image-title">
    {{ 'themeImage.title' | translate }}
  </h2>
  <div class="section-body">
    <app-theme-item-manage
      [headerId]="headerId()"
      [form]="form"
      [resetValue]="initialFormValue"
      [defaultBinding]="defaultBinding()" />
    <fieldset class="source-selection">
      <legend>{{ 'themeImage.sourceType' | translate }}</legend>
      <div class="source-options">
        <label class="source-option" for="imageKeyRadio">
          <input
            class="form-check-input"
            type="radio"
            [value]="eThemeImageType.key"
            id="imageKeyRadio"
            [formField]="group().type" />
          {{ 'themeImage.imageKey' | translate }}
        </label>
        <label class="source-option" for="imageUrlRadio">
          <input
            class="form-check-input"
            type="radio"
            [value]="eThemeImageType.url"
            id="imageUrlRadio"
            [formField]="group().type" />
          {{ 'themeImage.imageUrl' | translate }}
        </label>
      </div>
    </fieldset>
    @let type = group().type().value();
    @if (type === eThemeImageType.key) {
      <app-signal-field
        [field]="group().imageKey"
        label="themeImage.imageKey"
        [trim]="true" />
    } @else if (type === eThemeImageType.url) {
      <app-signal-field
        [field]="group().imageUrl"
        label="themeImage.imageUrl"
        hint="themeImage.imageUrlPlaceholder"
        [trim]="true" />
    }
    <app-form-alerts [form]="group()" [formAlerts]="formAlerts()" />
  </div>
</section>
