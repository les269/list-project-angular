<h2 mat-dialog-title>{{ 'title.copyThemeItem' | translate }}</h2>
<mat-dialog-content>
  <form (submit)="$event.preventDefault()">
    <div class="mb-3">
      <label for="sourceItemId" class="form-label">{{
        'themeItem.sourceItemId' | translate
      }}</label>
      <input
        id="sourceItemId"
        name="sourceItemId"
        type="text"
        class="form-control"
        [value]="data.sourceItemId"
        readonly />
    </div>

    <div class="mb-3">
      <label for="targetItemId" class="form-label require">{{
        'themeItem.targetItemId' | translate
      }}</label>
      <input
        id="targetItemId"
        type="text"
        class="form-control"
        [formField]="targetItemIdForm" />
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close [disabled]="isProcessing()">
    {{ 'g.no' | translate }}
  </button>
  <button
    mat-button
    cdkFocusInitial
    (click)="ok()"
    [disabled]="targetItemIdForm().invalid() || isProcessing()">
    {{ 'g.ok' | translate }}
  </button>
</mat-dialog-actions>
