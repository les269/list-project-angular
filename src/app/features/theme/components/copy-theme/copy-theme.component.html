<h2 mat-dialog-title class="dialog-title">
  {{ 'title.copyTheme' | translate }}
</h2>
<mat-dialog-content class="dialog-content">
  <form (submit)="$event.preventDefault()">
    <fieldset class="dialog-fields" [disabled]="isProcessing()">
      <app-signal-field
        [field]="nameControl"
        label="themeHeader.name"
        [trim]="true" />
      <app-signal-field
        [field]="versionControl"
        label="themeHeader.version"
        [trim]="true" />
      <app-signal-field
        [field]="typeControl"
        label="themeHeader.type"
        [type]="fieldType.SELECT"
        [options]="themeTypeOptions" />
      <app-signal-field
        [field]="titleControl"
        label="themeHeader.title"
        [trim]="true" />
    </fieldset>
  </form>
</mat-dialog-content>
<mat-dialog-actions class="dialog-actions" [attr.aria-busy]="isProcessing()">
  <button
    type="button"
    class="dialog-button"
    mat-dialog-close
    [disabled]="isProcessing()">
    {{ 'g.cancel' | translate }}
  </button>
  <button
    type="button"
    class="dialog-button dialog-button-primary"
    (click)="ok()"
    [disabled]="form().invalid() || isProcessing()">
    {{ (isProcessing() ? 'msg.copying' : 'g.copy') | translate }}
  </button>
</mat-dialog-actions>
