<h2 mat-dialog-title class="dialog-title">
  {{ 'searchBookmark.createItem' | translate }}
</h2>
<form (submit)="$event.preventDefault(); save()">
  <mat-dialog-content class="dialog-content">
    <div class="dialog-fields">
      <app-signal-field [field]="itemForm.value" label="searchBookmark.value" />
    </div>
  </mat-dialog-content>
  <mat-dialog-actions class="dialog-actions" [attr.aria-busy]="isSaving()">
    <button
      type="button"
      class="dialog-button"
      [disabled]="isSaving()"
      (click)="close()">
      {{ 'g.no' | translate }}
    </button>
    <button
      type="submit"
      class="dialog-button dialog-button-primary"
      [disabled]="isSaving()">
      {{ 'g.ok' | translate }}
    </button>
  </mat-dialog-actions>
</form>
