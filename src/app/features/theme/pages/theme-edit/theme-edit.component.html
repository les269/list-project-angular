<div class="theme-edit-page">
  <div class="page-heading">
    <button type="button" class="page-button" (click)="onBack()">
      {{ 'g.back' | translate }}
    </button>
    <h2 id="theme-header-title">{{ 'themeHeader.headline' | translate }}</h2>
  </div>

  <section class="form-panel" aria-labelledby="theme-header-title">
    <div class="form-grid">
      <app-signal-field
        [field]="form.name"
        label="themeHeader.name"
        [trim]="true" />
      <app-signal-field
        [field]="form.version"
        label="themeHeader.version"
        [trim]="true" />
      <app-signal-field
        [field]="form.type"
        label="themeHeader.type"
        [type]="fieldType.SELECT"
        [options]="themeTypeOptions" />
      <app-signal-field
        [field]="form.seq"
        label="themeHeader.seq"
        [type]="fieldType.NUMBER" />
      <app-signal-field
        class="field-wide"
        [field]="form.title"
        label="themeHeader.title"
        [trim]="true" />
    </div>
    <div class="form-actions" [attr.aria-busy]="isSaving()">
      <button
        type="button"
        class="page-button"
        [class.page-button-primary]="!isEditMode()"
        (click)="update(false, 'save')"
        [disabled]="!form().valid() || isSaving()">
        {{ (isSaving() ? 'msg.saving' : 'g.save') | translate }}
      </button>
      @if (isEditMode()) {
        <button
          type="button"
          class="page-button page-button-primary"
          (click)="update(true, 'commit')"
          [disabled]="!form().valid() || isSaving()">
          {{ (isSaving() ? 'msg.submitting' : 'g.submit') | translate }}
        </button>
      }
    </div>
  </section>

  <div class="theme-sections">
    @if (form.type().value() === eThemeHeaderType.imageList) {
      <app-theme-image
        [headerId]="currentHeaderId()"
        [imageItem]="imageItem()"
        [themeHeaderType]="form.type().value()" />
    }
    <app-theme-label-table
      [headerId]="currentHeaderId()"
      [labelItem]="labelItem()"
      [themeHeaderType]="form.type().value()" />
    <app-theme-dataset-table
      [headerId]="currentHeaderId()"
      [datasetItem]="datasetItem()" />
    <app-theme-custom-table
      [headerId]="currentHeaderId()"
      [customItem]="customItem()" />
    <app-theme-tag-table [headerId]="currentHeaderId()" [tagItem]="tagItem()" />
    <app-theme-other-setting
      [headerId]="currentHeaderId()"
      [otherSettingItem]="otherSettingItem()"
      [themeHeaderType]="form.type().value()" />
    <app-theme-top-custom-table
      [headerId]="currentHeaderId()"
      [topCustomItem]="topCustomItem()" />
  </div>
</div>
