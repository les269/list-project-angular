<h2 mat-dialog-title class="dialog-title">
  {{ 'apiRequestConfig.copy' | translate }}
</h2>
<mat-dialog-content class="dialog-content">
  <form
    id="copy-api-request-config-form"
    class="copy-fields"
    (submit)="onSave($event)">
    <app-signal-field
      [field]="valueForm.apiId"
      label="apiRequestConfig.apiId"
      [trim]="true" />
    <app-signal-field
      [field]="valueForm.description"
      label="g.description"
      [trim]="true" />
    @if (saveFailed()) {
      <div class="alert alert-danger save-error" role="alert">
        {{ 'apiRequestConfig.saveFailed' | translate }}
      </div>
    }
  </form>
</mat-dialog-content>
<mat-dialog-actions class="dialog-actions" [attr.aria-busy]="isSaving()">
  <button
    type="button"
    class="dialog-button"
    (click)="onCancel()"
    [disabled]="isSaving()">
    {{ 'g.no' | translate }}
  </button>
  <button
    type="submit"
    class="dialog-button dialog-button-primary"
    form="copy-api-request-config-form"
    [disabled]="isSaving()">
    {{ (isSaving() ? 'apiRequestConfig.saving' : 'g.copy') | translate }}
  </button>
</mat-dialog-actions>
