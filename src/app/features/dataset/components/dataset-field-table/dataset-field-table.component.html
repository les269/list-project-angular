<app-generic-table
  appearance="outlined"
  [fields]="fields()"
  [cols]="cols"
  [displayedColumns]="displayedColumns"
  [createRow]="createRow"
  [expandedTmpl]="expandedTmpl" />
<ng-template #expandedTmpl let-element>
  <div class="field-detail">
    @if (element.type().value() === 'fixedString') {
      <app-signal-field
        [field]="element.fixedString"
        label="dataset.fixedString"
        hint="dataset.fixedStringPH" />
    }
    <div class="replace-fields">
      <app-signal-field
        [field]="element.replaceRegular"
        label="dataset.replaceReg"
        hint="dataset.replaceRegular" />
      <app-signal-field
        [field]="element.replaceRegularTo"
        label="dataset.replaceRegularTo" />
    </div>
  </div>
</ng-template>
