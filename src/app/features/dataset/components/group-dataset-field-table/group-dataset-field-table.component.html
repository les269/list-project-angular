<app-generic-table
  appearance="outlined"
  [fields]="fields()"
  [cols]="cols"
  [displayedColumns]="displayedColumns"
  [createRow]="createRow"></app-generic-table>
<ng-template #expandedTmpl let-element>
  <div class="d-flex flex-column">
    <div class="d-flex flex-wrap gap-2 my-1 align-items-center">
      <span>{{ 'dataset.replaceValueMap' | translate }}</span>
      @if (element.replaceValueMapName) {
        <span class="text-break">{{ element.replaceValueMapName }}</span>
        <button
          class="btn btn-outline-primary d-flex"
          (click)="element.replaceValueMapName = ''">
          <mat-icon>cancel</mat-icon>
        </button>
      }
      <button
        class="btn btn-outline-primary d-flex"
        (click)="selectReplaceValueMap(element)">
        <mat-icon class="material-icons-outlined"
          ><span class="material-symbols-outlined">
            select_window_2
          </span></mat-icon
        >
      </button>
    </div>
  </div>
</ng-template>
<ng-container matColumnDef="expanded">
  <td
    mat-cell
    *matCellDef="let element; let i = dataIndex"
    [attr.colspan]="displayedColumns.length"></td>
</ng-container>
