<div class="dialog-header">
  <h2 mat-dialog-title class="dialog-title">
    {{ 'title.importExport' | translate }}
  </h2>
  <button
    type="button"
    class="dialog-close"
    [mat-dialog-close]="true"
    [attr.aria-label]="'g.close' | translate">
    <mat-icon>close</mat-icon>
  </button>
</div>
<mat-dialog-content class="dialog-content">
  <input
    type="file"
    accept=".json"
    (change)="import($event, true)"
    hidden
    #importJson />
  <input
    type="file"
    accept=".json"
    (change)="import($event)"
    hidden
    #importComplete />
  <div class="transfer-row" role="group" aria-labelledby="transfer-json-label">
    <span class="transfer-label" id="transfer-json-label">{{
      'dataset.jsonDataFormat' | translate
    }}</span>
    <button
      type="button"
      class="dialog-button"
      [attr.aria-label]="'dataset.importJson' | translate"
      (click)="importJson.click()">
      {{ 'g.import' | translate }}
    </button>
    <button
      type="button"
      class="dialog-button"
      [attr.aria-label]="'dataset.exportOnlyJson' | translate"
      (click)="export(true)">
      {{ 'g.export' | translate }}
    </button>
  </div>
  <div
    class="transfer-row"
    role="group"
    aria-labelledby="transfer-complete-label">
    <span class="transfer-label" id="transfer-complete-label">{{
      'dataset.completeDataFormat' | translate
    }}</span>
    <button
      type="button"
      class="dialog-button"
      [attr.aria-label]="'dataset.importComplete' | translate"
      (click)="importComplete.click()">
      {{ 'g.import' | translate }}
    </button>
    <button
      type="button"
      class="dialog-button"
      [attr.aria-label]="'dataset.exportComplete' | translate"
      (click)="export()">
      {{ 'g.export' | translate }}
    </button>
  </div>
</mat-dialog-content>
